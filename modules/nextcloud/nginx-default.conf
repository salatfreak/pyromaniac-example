# upstream to nextcloud FPM socket
upstream php-handler {
  zone backend 64k;
  server unix:/run/channels/fpm/socket;
}

# mark versioned assets as immutable for caching
map $arg_v $asset_immutable { "" ""; default ", immutable"; }

server {
  # listen on unix socket from reverse proxy
  listen unix:/run/channels/proxy/socket;

  # static file directory
  root /var/www/html;

  # change upload chunk size limit to 512 MB
  client_max_body_size 512M;

  # on requests to directories serve index files or fall back to /index.php
  index index.php index.html /index.php$request_uri;

  # include security headers
  include /etc/nginx/includes/security-headers.conf;

  # pass original source IP from unix socket
  set_real_ip_from unix:;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # increase buffer sizes and timeout
  fastcgi_buffers 64 4K;
  client_body_buffer_size 512k;
  client_body_timeout 300s;

  # enable gzip without removing ETag headers
  gzip on;
  gzip_vary on;
  gzip_comp_level 4;
  gzip_min_length 256;
  gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
  gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

  # make sure not to serve internal files
  location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
  location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }

  # redirect DAV clients to /remote.php
  location /remote { return 301 /remote.php$request_uri; }
  location = / {
    if ( $http_user_agent ~ ^DavClnt ) {
      return 302 /remote.php/webdav/$is_args$args;
    }
  }

  # disable logging for /robots.txt
  location = /robots.txt { log_not_found off; access_log off; }

  # handle /.well-known paths or fall back to /index.php
  location ^~ /.well-known {
    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav { return 301 /remote.php/dav/; }
    location /.well-known/acme-challenge { try_files $uri $uri/ =404; }
    location /.well-known/pki-validation { try_files $uri $uri/ =404; }
    return 301 /index.php$request_uri;
  }

  # pass requests to PHP files to upstream
  location ~ \.php(?:$|/) {
    include fastcgi_params;
    fastcgi_pass php-handler;

    # URL rewrites for legacy support
    rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

    # pass script path and request URI to PHP
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $path_info;

    # pass on HTTPS support
    fastcgi_param HTTPS on;

    # avoid sending security headers twice
    fastcgi_param modHeadersAvailable true;

    # enable pretty URLs
    fastcgi_param front_controller_active true;

    # avoid leaking FPM server info
    fastcgi_hide_header X-Powered-By;

    # serve error pages for status codes >= 300
    fastcgi_intercept_errors on;

    # buffer requests as PHP FPM doesn't allow chunked or streamed bodies
    fastcgi_request_buffering on;

    # disable buffering to temporary files
    fastcgi_max_temp_file_size 0;
  }

  # set custom mime types
  include mime.types;
  types {
    text/javascript mjs;
    application/wasm wasm;
  }

  # serve static files with caching and without logging
  location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
    try_files $uri /index.php$request_uri;
    add_header Cache-Control "public, max-age=15778463$asset_immutable" always;
    access_log off;

    # repeat security headers because setting one resets everything
    include /etc/nginx/includes/security-headers.conf;
  }

  location ~ \.(otf|woff2?)$ {
      try_files $uri /index.php$request_uri;
      expires 7d;
      access_log off;
  }

  # serve everything else from static files or fall back to /index.php
  location / {
      try_files $uri $uri/ /index.php$request_uri;
  }
}
